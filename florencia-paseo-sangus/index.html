<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2e9"><meta name="description" content="Audioguía de Florencia: seis paradas, audio, mapas y notas."><link rel="manifest" href="manifest.webmanifest"><title>Florencia a pie · Preparando la guía</title><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#f5f2e9;color:#292f2a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(420px,calc(100% - 48px));text-align:center}h1{font:400 36px/1.1 Georgia,serif;margin:0 0 14px}p{color:#687066;line-height:1.6}.bar{height:4px;background:#deded2;border-radius:9px;overflow:hidden;margin-top:24px}.bar:before{content:"";display:block;width:35%;height:100%;background:#a54730;animation:go 1.1s infinite ease-in-out}@keyframes go{from{transform:translateX(-110%)}to{transform:translateX(310%)}}</style></head><body><main><h1>Florencia a pie</h1><p id="status">Preparando la audioguía y su audio…</p><div class="bar"></div><noscript>Esta guía necesita JavaScript.</noscript></main><script>
(async()=>{
 const status=document.getElementById('status');
 if(!('serviceWorker' in navigator)) throw new Error('Este navegador no admite el modo necesario para cargar el audio.');
 await navigator.serviceWorker.register('./sw.js');
 await navigator.serviceWorker.ready;
 if(!navigator.serviceWorker.controller){
   await new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;resolve();};navigator.serviceWorker.addEventListener('controllerchange',finish,{once:true});setTimeout(finish,4000);});
   if(!navigator.serviceWorker.controller){location.reload();return;}
 }
 status.textContent='Abriendo las seis paradas…';
 const names=Array.from({length:3},(_,i)=>`payload/site-${String(i).padStart(3,'0')}.b64`);
 const parts=await Promise.all(names.map(async name=>{const r=await fetch(name);if(!r.ok)throw new Error('Falta '+name);return r.text();}));
 const raw=atob(parts.join(''));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
 const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 document.open();document.write(html);document.close();
})().catch(err=>{document.getElementById('status').textContent='No se pudo abrir la guía. Recarga la página. '+err.message;console.error(err);});
</script></body></html>
